<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accordion Survey</title>
    <meta
      name="description"
      content="A modern accordion survey with section tabs, rating questions, progress tracking, and instant results."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230f766e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8 6h13'/%3E%3Cpath d='M8 12h13'/%3E%3Cpath d='M8 18h13'/%3E%3Cpath d='M3 6h.01'/%3E%3Cpath d='M3 12h.01'/%3E%3Cpath d='M3 18h.01'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <p class="eyebrow">Feedback form</p>
          <h1>Accordion Survey</h1>
        </div>
        <div class="header-meta">
          <span id="overallProgress">0 / 12 answered</span>
          <button type="button" id="resetBtn" class="btn ghost">Reset</button>
        </div>
      </header>

      <div class="progress-track" aria-hidden="true">
        <div id="progressFill" class="progress-fill"></div>
      </div>

      <nav class="survey-tabs" role="tablist" aria-label="Survey sections">
        <button type="button" class="tab is-active" role="tab" aria-selected="true" data-survey="0">
          <span class="tab-index">01</span>
          Survey I
          <span class="tab-count" data-count="0">0/4</span>
        </button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-survey="1">
          <span class="tab-index">02</span>
          Survey II
          <span class="tab-count" data-count="1">0/4</span>
        </button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-survey="2">
          <span class="tab-index">03</span>
          Survey III
          <span class="tab-count" data-count="2">0/4</span>
        </button>
      </nav>

      <section id="surveyPanel" class="panel" aria-live="polite">
        <p id="surveyIntro" class="intro"></p>

        <div class="survey-card">
          <div class="survey-card-head">
            <h2 id="surveyTitle"></h2>
            <span id="surveyStatus" class="status-pill">In progress</span>
          </div>

          <div id="questionList" class="question-list"></div>

          <div class="survey-actions">
            <button type="button" id="prevSurvey" class="btn ghost">Previous</button>
            <button type="button" id="nextSurvey" class="btn ghost">Next section</button>
            <button type="button" id="sendBtn" class="btn primary">
              Send
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <path d="M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
        </div>
      </section>

      <section id="resultsPanel" class="panel results hidden">
        <h2>Thanks — responses saved</h2>
        <p class="intro">Here’s a quick summary of what you selected across all sections.</p>
        <div id="resultsList" class="results-list"></div>
        <div class="survey-actions">
          <button type="button" id="editAgain" class="btn ghost">Edit answers</button>
          <button type="button" id="downloadJson" class="btn primary">Download JSON</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
